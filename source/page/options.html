<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>MyChromeExtension 扩展设置</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; color: #212529; }
    .card { background-color: #f8f9fa; border: 0; border-radius: 6px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.075); }
    .card-subtitle { margin: 0 0 8px; padding-bottom: 8px; font-size: 13px; font-weight: 600; color: rgba(33,37,41,.75); border-bottom: 1px solid #dee2e6; }
    .form-check { display: flex; align-items: center; min-height: 1.5rem; margin-bottom: 2px; }
    .form-check.form-switch { position: relative; padding-left: 2.75em; }
    .form-switch .form-check-input { position: absolute; left: 0; width: 2em; height: 1em; margin: 0; -webkit-appearance: none; appearance: none; background-color: #adb5bd; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%23fff'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: left center; border: none; border-radius: 1em; transition: background-position .15s ease-in-out, background-color .15s ease-in-out; cursor: pointer; }
    .form-switch .form-check-input:checked { background-color: #0d6efd; background-position: right center; }
    .form-switch .form-check-input:focus { outline: none; box-shadow: 0 0 0 .2rem rgba(13,110,253,.25); }
    .form-check-label { cursor: pointer; }
    .fw-medium { font-weight: 500; }
    .mt-2 { margin-top: .5rem; }
    .mt-3 { margin-top: 1rem; }
    .mb-3 { margin-bottom: 1rem; }
    .form-label { display: block; margin-bottom: .25rem; }
    .form-control { display: block; width: 100%; padding: .375rem .75rem; font-size: 14px; line-height: 1.5; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: .375rem; }
    .form-control:focus { border-color: #86b7fe; outline: 0; box-shadow: 0 0 0 .25rem rgba(13,110,253,.25); }
    .border-top { border-top: 1px solid #dee2e6; }
    .btn { display: inline-block; padding: .25rem .5rem; font-size: 14px; line-height: 1.5; text-align: center; border: 1px solid transparent; border-radius: .375rem; cursor: pointer; color: #fff; }
    .btn-sm { font-size: 12.8px; }
    .py-1 { padding-top: .25rem; padding-bottom: .25rem; }
    .btn-warning { background-color: #ffc107; border-color: #ffc107; color: #000; }
    .btn-success { background-color: #198754; border-color: #198754; }
    a { color: #0d6efd; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>

<body style="min-width: 360px;">
  <div class="card shadow-sm p-3 bg-body-tertiary border-0">
    <h6 class="card-subtitle text-body-secondary border-bottom mb-2 pb-2">功能开关</h6>

    <!-- 以下是针对指定网站的优化，选项仅在对应的网站展示 -->
    <div class="form-check form-switch" style="display: none;">
      <input class="form-check-input" type="checkbox" id="v2exHideBackgroundImage">
      <label class="form-check-label fw-medium" for="v2exHideBackgroundImage">
        www.v2ex.com - 隐藏背景图
      </label>
    </div>
    <div class="form-check form-switch" style="display: none;">
      <input class="form-check-input" type="checkbox" id="v2exHideBackgroundColor">
      <label class="form-check-label fw-medium" for="v2exHideBackgroundColor">
        www.v2ex.com - 隐藏背景色
      </label>
    </div>
    <div class="form-check form-switch" style="display: none;">
      <input class="form-check-input" type="checkbox" id="v2exHideLogo">
      <label class="form-check-label fw-medium" for="v2exHideLogo">
        www.v2ex.com - 隐藏 Logo
      </label>
    </div>
    <div class="form-check form-switch" style="display: none;">
      <input class="form-check-input" type="checkbox" id="zhihuTitleFontFix">
      <label class="form-check-label fw-medium" for="zhihuTitleFontFix">
        www.zhihu.com - 标题字体优化
      </label>
    </div>
    <div class="form-check form-switch" style="display: none;">
      <input class="form-check-input" type="checkbox" id="zhihuWideScreenFix">
      <label class="form-check-label fw-medium" for="zhihuWideScreenFix">
        www.zhihu.com - 宽屏展示优化
      </label>
    </div>
    <div class="form-check form-switch" style="display: none;">
      <input class="form-check-input" type="checkbox" id="zhihuHideLogo">
      <label class="form-check-label fw-medium" for="zhihuHideLogo">
        www.zhihu.com - 隐藏 Logo
      </label>
    </div>
    <div class="form-check form-switch" style="display: none;">
      <input class="form-check-input" type="checkbox" id="zhihuReduceLineSpacing">
      <label class="form-check-label fw-medium" for="zhihuReduceLineSpacing">
        www.zhihu.com - 减小行间距
      </label>
    </div>
    <div class="form-check form-switch" style="display: none;">
      <input class="form-check-input" type="checkbox" id="youtubeHideVideoEndRecommend">
      <label class="form-check-label fw-medium" for="youtubeHideVideoEndRecommend">
        www.youtube.com - 隐藏视频结尾推荐
      </label>
    </div>

    <!-- 以下是针对所有网站的优化，选项仅在对应的网站展示 -->
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="allAllowTextSelect">
      <label class="form-check-label fw-medium" for="allAllowTextSelect">
        允许选中和复制文本
      </label>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="allDisallowBlurEvent">
      <label class="form-check-label fw-medium" for="allDisallowBlurEvent">
        禁止检测失焦事件
      </label>
    </div>
    <div class="form-check form-switch mt-3">
      <input class="form-check-input" type="checkbox" id="allHideWatermark">
      <label class="form-check-label fw-medium" for="allHideWatermark">
        隐藏水印元素
      </label>
    </div>
    <div class="mb-3">
      <label class="form-label">1. 每行配置一个域名</br>2. 配置的域名，同时会对子域名也生效</br>3. 域名前面添加 ! 符号，则排除不处理</br>4. 域名存在多级配置，以最长的规则为准</label>
      <textarea class="form-control" id="allHideWatermarkSites" rows="5"></textarea>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="allLimitFontSize">
      <label class="form-check-label fw-medium" for="allLimitFontSize">
        统一字体大小
      </label>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="allNoImageMode">
      <label class="form-check-label fw-medium" for="allNoImageMode">
        无图模式
      </label>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="allShowPassword">
      <label class="form-check-label fw-medium" for="allShowPassword">
        显示明文密码
      </label>
    </div>

    <!-- 以下是选项重置按钮 -->
    <div class="border-top mt-2 pt-2">
      <button id="clearAllConfig" class="btn btn-warning btn-sm py-1">
        全部禁用
      </button>
      <button id="resetAllConfig" class="btn btn-success btn-sm py-1">
        还原默认
      </button>
    </div>
  </div>

  <script src="options.js"></script>
</body>

</html>
